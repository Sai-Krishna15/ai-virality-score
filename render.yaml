# Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec

services:
  # ── Backend Node.js API ──
  - type: web
    name: virality-api
    env: node
    # Since it's a monorepo, we build from the root so workspaces are resolved
    buildCommand: npm install && npm run build
    # After build, we start the API from its specific workspace directory
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false # You will be prompted to enter this in the Render dashboard

  # ── Frontend Next.js Web App ──
  - type: web
    name: virality-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd apps/web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Automatically pass the deployed API URL to the Next.js frontend
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: virality-api
          envVarKey: RENDER_EXTERNAL_URL
