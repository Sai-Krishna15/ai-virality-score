services:
  # ── Backend Node.js API ──
  - type: web
    name: virality-api
    env: node
    rootDir: apps/api          # ✅ Build scoped to API folder only
    buildCommand: cd ../.. && npm install && npm run build --workspace=apps/api
    startCommand: node dist/index.js   # ✅ No need for cd, rootDir handles it
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # ✅ Explicit port (Render default)
      - key: GEMINI_API_KEY
        sync: false

  # ── Frontend Next.js Web App ──
  - type: web
    name: virality-web
    env: node
    rootDir: apps/web          # ✅ Build scoped to web folder only
    buildCommand: cd ../.. && npm install && npm run build --workspace=apps/web
    startCommand: npx next start -p $PORT   # ✅ Use Render's dynamic $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: virality-api
          envVarKey: RENDER_EXTERNAL_URL